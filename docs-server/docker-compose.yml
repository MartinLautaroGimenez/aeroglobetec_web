# docker compose up -d --build
services:
  docs:
    build: .
    container_name: aeroglobetec-docs
    restart: unless-stopped
    env_file: .env
    ports:
      # Solo desde la misma máquina: Caddy o Cloudflare Tunnel le ponen el https delante.
      # Si el https lo hace otra máquina (por ejemplo el nginx de la escuela), cambialo por "1234:1234".
      - "127.0.0.1:1234:1234"
